<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LyricsPlus settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img class="brand-logo" src="LRicon.png" alt="LyricsPlus original logo" width="40" height="40">
    <div><h1>Lyrics<span>Plus</span></h1><p>Read along, your way · v1.1.4</p></div>
  </header>
  <main>
    <p id="pageStatus" class="page-status" role="status">Checking Spotify lyrics…</p>
    <section class="settings-card" aria-label="Lyrics settings">
      <label class="setting-row primary" for="enabled"><span><strong>Enhance lyrics</strong><small>Pronunciation and reading controls</small></span><input id="enabled" type="checkbox" role="switch"></label>
      <div class="divider"></div>
      <label class="field-label" for="language">Pronunciation language</label>
      <select id="language"><option value="none">Off — original lyrics</option><option value="korean">Korean</option><option value="japanese">Japanese kana</option><option value="chinese">Chinese pinyin</option><option value="thai">Thai</option></select>
      <p class="hint">Japanese pronunciation currently covers kana.</p>
      <div class="divider"></div>
      <fieldset class="display-field"><legend>Show</legend><div class="segments"><label><input type="radio" name="display" value="original"><span>Read</span></label><label><input type="radio" name="display" value="pronunciation"><span>Pronounce</span></label><label><input type="radio" name="display" value="both"><span>Both</span></label></div></fieldset>
      <div class="slider-field"><label for="fontSize">Lyrics size <output id="fontSizeValue">36px</output></label><div class="slider-line"><span class="size-small" aria-hidden="true">A</span><input id="fontSize" type="range" min="20" max="64" step="2"><span class="size-large" aria-hidden="true">A</span></div></div>
      <div class="slider-field"><label for="lineSpacing">Line spacing <output id="lineSpacingValue">1.45</output></label><div class="slider-line"><span aria-hidden="true">☰</span><input id="lineSpacing" type="range" min="1" max="2" step="0.05"><span aria-hidden="true">☷</span></div></div>
      <div class="divider"></div>
      <label class="setting-row" for="highContrast"><span>High contrast</span><input id="highContrast" type="checkbox" role="switch"></label>
      <label class="setting-row" for="reducedMotion"><span>Reduce motion</span><input id="reducedMotion" type="checkbox" role="switch"></label>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer><button id="openLyrics" type="button">Open lyrics ↗</button><a href="https://github.com/dupitydumb/LyricsPlus-Spotify/issues" target="_blank" rel="noopener noreferrer">Report an issue ↗</a></footer>
  <script src="popup.js"></script>
</body>
</html>
